<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redefina sua senha no SeekIn</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f7f9fc;
      color: #13233f;
      font-family: Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              max-width: 560px;
              background: #ffffff;
              border: 1px solid #dde5ed;
              border-radius: 16px;
            "
          >
            <tr>
              <td style="padding: 32px">
                <p
                  style="
                    margin: 0 0 24px;
                    color: #3266a8;
                    font-size: 18px;
                    font-weight: 700;
                  "
                >
                  SeekIn
                </p>
                <h1
                  style="margin: 0 0 16px; font-size: 28px; line-height: 1.25"
                >
                  Redefina sua senha
                </h1>
                <p
                  style="
                    margin: 0 0 24px;
                    color: #65758a;
                    font-size: 16px;
                    line-height: 1.6;
                  "
                >
                  Escolha uma nova senha para voltar à sua conta.
                </p>
                <a
                  href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery"
                  style="
                    display: inline-block;
                    padding: 14px 20px;
                    color: #ffffff;
                    background: #3266a8;
                    border-radius: 8px;
                    font-size: 15px;
                    font-weight: 700;
                    text-decoration: none;
                  "
                  >Criar nova senha</a
                >
                <p
                  style="
                    margin: 24px 0 0;
                    color: #65758a;
                    font-size: 13px;
                    line-height: 1.5;
                  "
                >
                  Se você não pediu uma nova senha, ignore esta mensagem.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
